name: Build Aimbot
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup NDK
        uses: nvioletti/setup-ndk@v1
        with:
          ndk-version: r21e
      - name: Build with ndk-build
        run: ndk-build -C jni/
      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          name: libaimbot-arm32
          path: libs/armeabi-v7a/libriski_aimbot.so
