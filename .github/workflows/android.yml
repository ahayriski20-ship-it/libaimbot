name: Build Aimbot
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ndk-build
        run: |
          $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaimbot-arm32
          path: libs/armeabi-v7a/libriski_aimbot.so
